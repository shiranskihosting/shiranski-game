<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>בדיקת קוד פרס</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap">
<style>
:root{--bg:#141210;--card:#1F1C19;--line:#3A352E;--fg:#F4EEE3;--muted:#B8AE9E;--gold:#C9A96E;--ok:#9DBB7A;--bad:#C97A6E;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 Assistant,system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:24px 16px;display:grid;gap:14px}
h1{margin:0;font-size:24px;color:var(--gold)}
input{font:22px ui-monospace,Menlo,monospace;letter-spacing:.1em;direction:ltr;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-transform:uppercase}
.out{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:24px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:6px;border-bottom:1px solid var(--line)}td:first-child{font-family:ui-monospace,monospace;color:var(--gold);width:3em;text-align:center}
small{color:var(--muted)}
</style></head><body><main>
<h1>בדיקת קוד פרס</h1>
<small>דף פנימי לשירנסקי מארח. מקלידים את הקוד שהלקוח שלח, ורואים אם הוא אמיתי ומה הפרס.</small>
<input id="c" placeholder="SH-K4TQ-M" autocomplete="off" maxlength="9">
<div class="out" id="o">הקוד יופיע כאן.</div>
<h2 style="margin:8px 0 0;font-size:18px">מפתח: האות שאחרי SH-</h2>
<table id="t"></table>
<small>קוד אמיתי בנוי ככה: SH-, אות פרס, 3 תווים, מקף ותו בדיקה. קוד שהומצא כמעט תמיד ייכשל בבדיקה.</small>
</main>
<script src="js/data.js"></script>
<script>
document.getElementById("t").innerHTML = Object.entries(PRIZES).map(([k,p])=>`<tr><td>${k}</td><td>${p.label}</td></tr>`).join("");
document.getElementById("c").addEventListener("input",e=>{
  const v=e.target.value.trim().toUpperCase(), o=document.getElementById("o");
  const m=v.match(/^SH-([A-Z0-9]{4})-([A-Z0-9])$/);
  if(!m){ o.textContent = v.length<9 ? "הקוד יופיע כאן." : "המבנה לא תקין."; return; }
  const body=m[1], P=PRIZES[body[0]];
  o.innerHTML = (P && codeCheck(body)===m[2]) ? `<span class="ok">קוד אמיתי.</span> הפרס: <b>${P.label}</b>` : `<span class="bad">הקוד לא תקין.</span> ייתכן שהוקלד לא נכון, או שהוא מזויף.`;
});
</script></body></html>
